name: Build and Release Packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 1. Тестирование скрипта
  test:
    name: Test Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Bash Syntax
        run: bash -n count_files.sh

      - name: Test Script Execution
        run: |
          chmod +x count_files.sh
          ./count_files.sh /etc

  # 2. Сборка RPM (Fedora 39 / 40)
  build-rpm:
    name: Build RPM Package
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora_version: ["39", "40"]
    container:
      image: fedora:${{ matrix.fedora_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache DNF Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/dnf
          key: dnf-fedora-${{ matrix.fedora_version }}-${{ hashFiles('packaging/rpm/count-files.spec') }}
          restore-keys: |
            dnf-fedora-${{ matrix.fedora_version }}-

      - name: Install dependencies
        run: dnf install -y rpm-build rpmdevtools bash coreutils findutils tar

      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar -czf ~/rpmbuild/SOURCES/count-files-1.0.tar.gz --transform 's|^|count-files-1.0/|' count_files.sh
          cp packaging/rpm/count-files.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/count-files.spec
          mkdir -p output/
          cp ~/rpmbuild/RPMS/noarch/*.rpm output/

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package-fedora${{ matrix.fedora_version }}
          path: output/*.rpm

  # 3. Автоматическая чистая сборка DEB (Ubuntu 22.04 / 24.04)
  build-deb:
    name: Build DEB Package
    needs: test
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    strategy:
      matrix:
        ubuntu_version: ["22.04", "24.04"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-${{ matrix.ubuntu_version }}-${{ hashFiles('count_files.sh') }}
          restore-keys: |
            apt-ubuntu-${{ matrix.ubuntu_version }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential

      - name: Generate Clean DEB Package Structure
        run: |
          rm -rf packaging/deb
          mkdir -p packaging/deb/debian

          cp count_files.sh packaging/deb/count_files.sh
          chmod +x packaging/deb/count_files.sh

          cat << 'EOF' > packaging/deb/debian/control
          Source: count-files
          Section: utils
          Priority: optional
          Maintainer: Kirienko Mykhailo <fhidxh7@gmail.com>
          Build-Depends: debhelper-compat (= 13)
          Standards-Version: 4.6.2

          Package: count-files
          Architecture: all
          Depends: ${misc:Depends}, bash, coreutils, findutils
          Description: Script to count regular files in /etc
           A Bash script that counts regular files in /etc directory.
          EOF

          cat << 'EOF' > packaging/deb/debian/changelog
          count-files (1.0-1) unstable; urgency=medium

            * Initial release.

           -- Kirienko Mykhailo <fhidxh7@gmail.com>  Thu, 18 Dec 2025 16:48:00 +0000
          EOF

          echo "count_files.sh usr/bin" > packaging/deb/debian/install
          printf '#!/usr/bin/make -f\n%%:\n\tdh %%s\n' '$@' > packaging/deb/debian/rules
          chmod +x packaging/deb/debian/rules

      - name: Build DEB Package
        run: |
          cd packaging/deb
          dpkg-buildpackage -us -uc -b
          cd ../..
          mkdir -p output/
          cp packaging/*.deb output/

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package-ubuntu${{ matrix.ubuntu_version }}
          path: output/*.deb

  # 4. Публикация релиза на GitHub
  release:
    name: Create GitHub Release
    needs: [build-rpm, build-deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Create Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
